<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover enables env(safe-area-inset-*) on iOS notch / home-bar devices -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>The Best Is Yet to Come · For Nannagaru</title>
<!-- Noto Sans Telugu: correct glyph rendering for Telugu-script messages -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Base ── */
:root{--gold:#ffd58a;--cream:#fff3df;--ink:#172033;--glass:rgba(15,22,36,.82);--muted:#e2d5c0}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111b2a;color:var(--cream);font-family:Georgia,'Times New Roman',serif}
/* touch-action:none prevents the browser intercepting canvas drags as scroll gestures */
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,10,20,.14),transparent 30%,transparent 65%,rgba(5,9,17,.52)),radial-gradient(ellipse at center,transparent 42%,rgba(3,7,15,.45) 100%)}

/* ── HUD ── */
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,36px);/* safe-area bottom handled below */}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{letter-spacing:.18em;text-transform:uppercase;font:600 10px/1.5 system-ui,sans-serif;color:#ffe1a5}
.chapterCount{font:12px system-ui,sans-serif;color:#fff2d8;background:#0d1729a8;border:1px solid #fff4d033;border-radius:30px;padding:9px 13px;backdrop-filter:blur(12px)}
.hero{max-width:660px;margin:auto auto 5vh 0;text-shadow:0 2px 24px #0008;transition:opacity .35s,transform .35s}
.eyebrow{font:600 11px system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.hero h1{font-weight:400;font-size:clamp(38px,7vw,82px);line-height:.98;letter-spacing:-.04em;margin:0 0 16px}
.hero p{font-size:clamp(15px,2vw,20px);line-height:1.55;color:#fff1d7;max-width:520px;margin:0}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;pointer-events:auto}
.hint{font:12px/1.5 system-ui,sans-serif;color:#fff0d0b8;max-width:230px}
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ── Buttons ── */
button{font:600 12px system-ui,sans-serif;letter-spacing:.02em;border:1px solid #fff3d74a;color:#fff3df;background:#111a2abf;padding:12px 16px;border-radius:30px;backdrop-filter:blur(14px);cursor:pointer;transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:#29344bcc}
button.primary{background:var(--gold);color:#282014;border-color:var(--gold)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:3px solid #fff}

/* ── Memory panel: cinematic side-panel (desktop) / bottom-sheet (mobile) ── */
/* visibility:hidden instead of display:none lets CSS transforms animate in/out */
.panelWrap{position:fixed;inset:0;z-index:5;visibility:hidden;pointer-events:none;transition:visibility 0s .5s}
.panelWrap.show{visibility:visible;pointer-events:auto;transition:visibility 0s}

/* Soft backdrop — suppressed on wide screens, dims scene on mobile */
.panelBackdrop{position:absolute;inset:0;background:transparent;transition:background .45s ease}
.panelWrap.show .panelBackdrop{background:rgba(7,16,27,.45)}
@media(min-width:900px){.panelBackdrop{background:transparent!important;pointer-events:none}}

/* ── Story panel ── */
.panel{
  position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);
  background:linear-gradient(165deg,#1c2e44 0%,#111d2f 58%,#0c1623 100%);
  border-left:1px solid rgba(255,220,145,.16);
  padding:clamp(48px,6vw,68px) clamp(22px,4vw,44px) clamp(28px,4vw,48px);
  overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .52s cubic-bezier(.16,1,.3,1);
  box-shadow:-16px 0 64px rgba(0,0,0,.55);will-change:transform;
  scrollbar-width:thin;scrollbar-color:rgba(255,213,138,.2) transparent
}
.panelWrap.show .panel{transform:translateX(0)}

/* ── Mobile: bottom sheet ── */
@media(max-width:899px){
  .panelWrap.show .panelBackdrop{background:rgba(7,16,27,.62)}
  .panel{
    top:auto;left:0;right:0;width:100%;max-height:82dvh;
    border-left:none;border-top:1px solid rgba(255,220,145,.18);
    border-radius:22px 22px 0 0;
    padding:0 clamp(18px,5vw,28px) max(24px,calc(16px + env(safe-area-inset-bottom,0px)));
    transform:translateY(102%);box-shadow:0 -16px 64px rgba(0,0,0,.55)
  }
  .panelWrap.show .panel{transform:translateY(0)}
  /* Drag-handle pill */
  .panel::before{
    content:'';display:block;flex-shrink:0;
    width:40px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.22);margin:14px auto 20px
  }
}
@media(prefers-reduced-motion:reduce){.panel,.panelBackdrop{transition:none}}

/* ── Panel close button ── */
.panel-close{
  position:sticky;top:0;float:right;flex-shrink:0;
  margin:-4px -4px 10px 12px;
  width:36px;height:36px;min-width:36px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  color:#c4b492;font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s
}
.panel-close:hover{background:rgba(255,255,255,.18)}
.panel-close:focus-visible{outline:3px solid #fff}

/* ── Panel typography ── */
.panel-year{font:600 10px/1.5 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.panel-title{font:400 clamp(24px,3.5vw,40px)/1.08 Georgia,'Times New Roman',serif;letter-spacing:-.03em;color:var(--cream);margin:0 0 10px}
.panel-subtitle{font:italic clamp(13px,1.5vw,16px)/1.6 Georgia,serif;color:rgba(255,240,205,.62);margin:0 0 22px}
.panel-rule{width:44px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:0 0 22px;border:none;flex-shrink:0}

/* ── Story paragraphs ── */
.panel-story{display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
.panel-story p{font-size:clamp(14px,1.4vw,16px);line-height:1.85;color:#ede0cc;margin:0}

/* ── Telugu message ── */
.panel-telugu{
  border-top:1px solid rgba(255,218,130,.12);padding-top:14px;margin-bottom:16px;
  font-size:clamp(15px,1.7vw,19px);line-height:1.9;color:#ffdc9d;
  font-family:'Noto Sans Telugu','Potti Sreeramulu',system-ui,sans-serif
}

/* ── Photo galleries ── */
.photoGallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px 0 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.photoGallery::-webkit-scrollbar{display:none}
.photoGallery figure{margin:0;min-width:min(230px,82%);max-width:320px;flex-shrink:0;scroll-snap-align:start}
.photoGallery img{width:100%;height:160px;object-fit:cover;background:#0a1423;border-radius:12px;border:1px solid rgba(255,240,200,.1)}
.photoGallery figcaption{font:11px/1.4 system-ui,sans-serif;color:#c4b090;margin:6px 4px 0}
.photoGallery:empty{display:none}

/* ── Panel action buttons ── */
.panel-actions{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:9px}
.panel-actions .panel-continue{width:100%;text-align:center;padding:14px;font-size:13px}
.panel-actions .panel-return{width:100%;text-align:center;font-size:11px;color:rgba(255,240,200,.65);background:transparent;border-color:rgba(255,240,200,.15)}

/* ── Progress dots ── */
.progress{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);display:flex;gap:6px;z-index:2;pointer-events:auto}
.dot{width:8px;height:8px;padding:0;border-radius:50%;min-width:8px;background:#fff7d655;border:1px solid #fff8d988}
.dot.active{background:var(--gold);box-shadow:0 0 15px #ffce70}

/* ── Loading overlay ── */
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#111b2a;z-index:10;font:13px system-ui,sans-serif;color:#ffe0a0;letter-spacing:.08em;transition:opacity .6s}
.loading.hide{opacity:0;pointer-events:none}

/* ── Misc ── */
.hud .hero{pointer-events:none}

/* ── iOS safe-area insets ──────────────────────────────────────────────────
   env(safe-area-inset-bottom) is non-zero only on iPhones with home indicator.
   The fallback value 0px keeps behaviour identical on all other devices.      */
.progress{bottom:calc(95px + env(safe-area-inset-bottom, 0px))}
.hud{padding-bottom:max(clamp(16px,3vw,36px), calc(12px + env(safe-area-inset-bottom, 0px)))}

/* ── Small screens ── */
@media(max-width:600px){
  .hud{padding:17px;padding-bottom:max(17px, calc(10px + env(safe-area-inset-bottom, 0px)))}
  .hero{margin-bottom:6vh}
  .hero h1{font-size:clamp(38px,12vw,64px)}
  .bottom{align-items:flex-end}
  .hint{display:none}
  .controls{max-width:100%}
  .controls button{padding:11px 13px;font-size:11px}
  .progress{bottom:calc(94px + env(safe-area-inset-bottom, 0px))}
  .brand{font-size:9px}
  /* Panel mobile overrides handled inside the 899px breakpoint in the panel block */
}
</style>
</head>
<body>

<canvas id="scene" aria-label="A 3D mountain road birthday journey"></canvas>
<div id="vignette"></div>
<div class="loading" id="loading">PREPARING THE ROAD AHEAD…</div>

<div class="hud">
  <div class="top">
    <div class="brand">A birthday journey · made with love</div>
    <div class="chapterCount" id="count">THE BEGINNING · 1 OF 5</div>
  </div>
  <section class="hero" id="hero">
    <div class="eyebrow" id="eyebrow">For Nannagaru</div>
    <h1 id="title">The best<br>is yet to come.</h1>
    <p id="subtitle">57 years behind you. So many beautiful miles still ahead.</p>
  </section>
  <div class="bottom">
    <div class="hint" id="hint">A little journey through your life—and the wonderful road still ahead.</div>
    <div class="controls">
      <button id="prevBtn">← Previous</button>
      <button id="memoryBtn">Open this stop ↗</button>
      <button class="primary" id="nextBtn">Begin the journey →</button>
    </div>
  </div>
</div>

<!-- B6: error display — shown on fetch / WebGL / config failure -->
<div id="errorMessage" role="alert" aria-live="assertive"
     style="display:none;position:fixed;top:55px;left:16px;right:16px;background:#2a1010;color:#ffd0c0;padding:18px 20px;z-index:20;border-radius:14px;border:1px solid #ff6b4a55;font:14px/1.6 system-ui,sans-serif;max-width:600px"></div>

<div class="progress" id="progress" aria-label="Journey stops"></div>

<!--
  Memory panel — cinematic side panel on desktop, bottom sheet on mobile.
  All id="" values preserved: openModal/closeModal and listener setup rely on them.
  role="dialog" + aria-modal + aria-labelledby provide correct AT semantics.
  Initial aria-hidden="true" removed when panel opens; restored on close.
-->
<div class="panelWrap" id="modalWrap"
     role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-hidden="true">

  <!-- Backdrop: click closes panel (full-screen, behind .panel in stacking order) -->
  <div class="panelBackdrop" id="panelBackdrop" aria-hidden="true"></div>

  <article class="panel">
    <!-- ✕ close button — sticky at the top-right corner of the panel -->
    <button class="panel-close" id="closeBtn" aria-label="Return to road">✕</button>

    <!-- Stop identity ────────────────────────────────────────────────────── -->
    <!-- mEyebrow  ← s.year + ' · ' + c.tag  (set by openModal) -->
    <div class="panel-year" id="mEyebrow"></div>
    <!-- mTitle    ← s.title (stop headline, set by openModal) -->
    <h2 class="panel-title" id="mTitle"></h2>
    <!-- mSubtitle ← c.subtitle (set by openModal) -->
    <p class="panel-subtitle" id="mSubtitle"></p>
    <hr class="panel-rule" aria-hidden="true">

    <!-- Configured photos (empty = gallery hides itself via :empty) -->
    <div id="photoGallery" class="photoGallery" aria-label="Photographs"></div>

    <!-- Story body: openModal injects <p> per paragraph (split on \n\n) -->
    <div class="panel-story" id="mBody"></div>

    <!-- Telugu message: hidden attr managed by openModal / removed when empty -->
    <div class="panel-telugu" id="mTelugu" hidden aria-label="Message in Telugu"></div>

    <!-- Future-scene gallery (last stop only) -->
    <div id="futureGallery" class="photoGallery" aria-label="Future possibilities"></div>

    <!-- Navigation ─────────────────────────────────────────────────────── -->
    <div class="panel-actions">
      <button class="primary panel-continue" id="continueBtn">Continue the journey →</button>
      <!-- Secondary close — identical behaviour to ✕, just a labelled text button -->
      <button class="panel-return" id="panelReturnBtn">Return to Road</button>
    </div>
  </article>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

// ── Helper: show a readable error to the user ─────────────────────────────
// Called before the loading screen is dismissed so we can update its text.
function showError(msg) {
  const el = document.getElementById('errorMessage');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
  const loading = document.getElementById('loading');
  if (loading) {
    loading.textContent = '⚠ Could not start the journey.';
    // Leave the overlay visible — the scene beneath would be empty without content.
  }
}

// ── WebGL availability check ──────────────────────────────────────────────
// Checked first so a clear message appears before any asset fetching starts.
{
  const probe = document.createElement('canvas');
  if (!probe.getContext('webgl2') && !probe.getContext('webgl')) {
    showError(
      '3D graphics (WebGL) are not available in this browser. ' +
      'Please try a current version of Chrome, Safari, or Firefox.'
    );
    throw new Error('WebGL unavailable');
  }
}

// ── Load content configuration ────────────────────────────────────────────
let content;
try {
  const resp = await fetch('./content.json');
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
  content = await resp.json();
} catch (err) {
  showError(
    'Could not load content.json — ' + err.message + '. ' +
    'Open the project via a local server (python -m http.server 8000) rather than the file:// protocol.'
  );
  throw err;
}

// Validate: at least one enabled stop must exist.
const stops = content.stops.filter(s => s.enabled).sort((a, b) => a.roadPosition - b.roadPosition);
if (!stops.length) {
  showError(
    'No enabled stops found in content.json. ' +
    'Set "enabled": true on at least one stop in the "stops" array.'
  );
  throw new Error('No enabled stops');
}

// Map stops → flat chapter objects used throughout the UI.
const SCENE_TYPES = ['beginning', 'building', 'family', 'renewal', 'future'];
const chapters = stops.map(s => ({
  tag:     s.title,
  title:   s.headline,
  subtitle: s.subtitle,
  stop:    s.markerLabel,
  body:    s.story,
  season:  Math.max(0, SCENE_TYPES.indexOf(s.sceneType)),
}));
const markerTs = stops.map(s => THREE.MathUtils.clamp(Number(s.roadPosition), 0.04, 0.94));

// ── Shorthand & shared state ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
let current = 0, travelling = false, stopped = true;
const canvas = $('scene');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Renderer ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e7a66f');
scene.fog        = new THREE.FogExp2('#d99b6a', 0.0095);

const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 2.6, 0);

// Lights
scene.add(new THREE.HemisphereLight(0xc9dcff, 0x64513b, 2.0));
const sun = new THREE.DirectionalLight(0xffd19a, 3.2);
sun.position.set(-70, 100, -130);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ── Materials ─────────────────────────────────────────────────────────────
const mat      = (color, roughness = 1) => new THREE.MeshStandardMaterial({ color, roughness });
const groundMat = mat('#52694d');
const roadMat   = mat('#343b43');
const lineMat   = mat('#f6dca2');
// B4 FIX: rockMat removed — was declared in the original but no rock geometry
// was ever created, making it pure dead weight in the material pool.
const treeMats  = ['#315b49', '#47684a', '#6f7650', '#8b654c'].map(c => mat(c));

// ── Ground ────────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

// ── Road spline ───────────────────────────────────────────────────────────
// 241 control points. X winds sinusoidally; Z grows linearly; Y stays at 0.
// (Elevation is a Phase 3 enhancement — not changed here.)
const splinePoints = [];
for (let i = 0; i <= 240; i++) {
  const z = -i * 2.8;
  const x = Math.sin(i * 0.035) * 23 + Math.sin(i * 0.012) * 19;
  splinePoints.push(new THREE.Vector3(x, 0, z));
}
const path = new THREE.CatmullRomCurve3(splinePoints, false, 'catmullrom', 0.35);
const pathLength = path.getLength();

// ── Road surface ──────────────────────────────────────────────────────────
// Custom quad-strip ribbon following the spline's tangent, keeping road width exact.
function ribbon(curve, width, segments, material, yOffset = 0) {
  const verts = [], uv = [], idx = [];
  for (let i = 0; i <= segments; i++) {
    const t    = i / segments;
    const p    = curve.getPointAt(t);
    const tan  = curve.getTangentAt(t);
    const side = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    verts.push(
      p.x + side.x * width / 2, p.y + yOffset, p.z + side.z * width / 2,
      p.x - side.x * width / 2, p.y + yOffset, p.z - side.z * width / 2
    );
    uv.push(0, t * 30, 1, t * 30);
    if (i < segments) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
const road = ribbon(path, 9, 1200, roadMat, 0.015);
road.receiveShadow = true;
scene.add(road);

// ── Road dashes ───────────────────────────────────────────────────────────
const dashGroup = new THREE.Group();
for (let i = 0; i < 260; i++) {
  const t = i / 260;
  const a = path.getPointAt(t);
  const b = path.getPointAt(Math.min(1, t + 0.003));
  const d = new THREE.Vector3().subVectors(b, a).normalize();
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.035, Math.max(0.5, d.length() * 2.4)),
    lineMat
  );
  mesh.position.copy(a);
  mesh.position.y = 0.055;
  mesh.rotation.y = Math.atan2(d.x, d.z);
  dashGroup.add(mesh);
}
scene.add(dashGroup);

// ── Seeded pseudo-random number generator ─────────────────────────────────
// B1-adjacent: both mountains and trees used Math.random(), making the scenery
// layout change on every reload.  Replacing with a seeded PRNG (mulberry32)
// gives a deterministic layout that is identical across all page loads.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Single RNG instance used for ALL procedural scenery — mountains then trees,
// in construction order, to keep the sequence stable across future edits.
const rng = mulberry32(0xBEEFCAFE);

// ── Shared matrix composition helpers ────────────────────────────────────
// Reusing these objects across every instanced-mesh iteration avoids
// allocating new Matrix4/Quaternion/Vector3 on each of the ~1,600 calls.
const _m4   = new THREE.Matrix4();
const _qY   = new THREE.Quaternion();
const _axY  = new THREE.Vector3(0, 1, 0);
const _ipos = new THREE.Vector3();
const _iscl = new THREE.Vector3();

// ── Mountains (Phase 2: InstancedMesh) ────────────────────────────────────
// Previously: ~360 individual THREE.Mesh objects (one per cone), each with
// its own ConeGeometry and material → ~360 draw calls.
// Now: 6 InstancedMesh batches (one per colour range) sharing a single unit
// cone geometry → 6 draw calls.
//
// Unit cone ConeGeometry(1, 1, 6): base radius = 1, height = 1, 6 segments.
// Non-uniform instance scaling reproduces the original height/radius variation:
//   scaleX = scaleZ = mountainRadius   (matches original cone radius)
//   scaleY = h * 1.1                   (matches original h + mesh.scale.y = 1.1)
//   posY   = h / 2 - 1                 (matches original mesh.position.y)
//
// RNG consumption order and count per mountain are IDENTICAL to the original
// makeMountains() loop, preserving all subsequent tree positions exactly.
const mountainConeGeo = new THREE.ConeGeometry(1, 1, 6);

const mountainRanges = [
  { side: -1, layer: 0, count: 65, color: '#6b7180', scale: 0.8   },
  { side:  1, layer: 0, count: 65, color: '#7b7781', scale: 0.8   },
  { side: -1, layer: 1, count: 60, color: '#555d70', scale: 1.25  },
  { side:  1, layer: 1, count: 60, color: '#626477', scale: 1.25  },
  { side: -1, layer: 2, count: 55, color: '#3d4b60', scale: 1.7   },
  { side:  1, layer: 2, count: 55, color: '#455168', scale: 1.7   },
];

for (const range of mountainRanges) {
  const { side, layer, count, color, scale } = range;
  const imesh = new THREE.InstancedMesh(mountainConeGeo, mat(color), count);
  imesh.frustumCulled = false; // instances span the full scene length; let the GPU cull

  for (let i = 0; i < count; i++) {
    // ── Six RNG calls per mountain, same order as original makeMountains() ─
    const z      = -30 - i * 16 - rng() * 8;                      // rng #1: z spread
    const h      = (18 + rng() * 32) * scale;                      // rng #2: height
    const radius = (12 + rng() * 18) * scale;                      // rng #3: base radius
    rng();                                                          // rng #4: segment count (consumed; unit cone is always 6 segments)
    const latOff = side * (24 + layer * 19 + rng() * 12);          // rng #5: lateral offset
    const rotY   = rng() * Math.PI;                                 // rng #6: rotation

    const tApprox = Math.min(0.99, Math.max(0, -z / pathLength));
    const centerX = path.getPointAt(tApprox).x;

    _ipos.set(centerX + latOff, h / 2 - 1, z);
    _qY.setFromAxisAngle(_axY, rotY);
    _iscl.set(radius, h * 1.1, radius);
    _m4.compose(_ipos, _qY, _iscl);
    imesh.setMatrixAt(i, _m4);
  }

  imesh.instanceMatrix.needsUpdate = true;
  scene.add(imesh);
}

// ── Trees (Phase 2: InstancedMesh) ────────────────────────────────────────
// Previously: 320 THREE.Group objects each containing 4 meshes (1 trunk +
// 3 foliage cones) = 1,280 individual draw calls, each with its own unique
// CylinderGeometry or ConeGeometry allocated on the heap.
//
// Now: 5 InstancedMesh batches → 5 draw calls.
//   trunkMesh      CylinderGeometry(0.12, 0.2, 1.4, 5)  ×  320 instances
//   foliageMesh[0] ConeGeometry(1, 1, 6)  ×  (trees of colour 0) × 3 tiers
//   foliageMesh[1] ConeGeometry(1, 1, 6)  ×  (trees of colour 1) × 3 tiers
//   foliageMesh[2] ConeGeometry(1, 1, 6)  ×  (trees of colour 2) × 3 tiers
//   foliageMesh[3] ConeGeometry(1, 1, 6)  ×  (trees of colour 3) × 3 tiers
//
// Matrix geometry notes:
//   Trunk    — uniform scale s reproduces CylinderGeometry(0.12s, 0.2s, 1.4s, 5).
//              Centred at world y = 0.7s so base sits at y = 0 (ground level).
//   Foliage  — unit cone scaled non-uniformly per tier:
//              scaleX = scaleZ = (1 − j·0.19)·s  (horizontal radius for tier j)
//              scaleY = 1.8·s                      (cone height for all tiers)
//              posY   = (1.2 + j·0.62)·s          (cone centre, matches original)
//
// RNG consumption is IDENTICAL to the Phase 1 B1-fix loop (6 calls per tree
// in the same order) so all world positions are preserved exactly.

const TREE_COUNT    = 320;
const FOLIAGE_TIERS = 3;

// Shared geometries — one instance used for all 320 trunks / all foliage.
const trunkGeo   = new THREE.CylinderGeometry(0.12, 0.2, 1.4, 5);
const foliageGeo = new THREE.ConeGeometry(1, 1, 6); // unit cone, scaled per instance

// Trunk InstancedMesh (1 material, 320 instances).
const trunkMat  = mat('#5c4538');
const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
trunkMesh.frustumCulled = false;

// Foliage InstancedMesh per colour (4 meshes, shared geometry, different material).
// Worst-case count = all trees same colour: TREE_COUNT × FOLIAGE_TIERS.
// Actual count trimmed after the loop via imesh.count.
const foliageMeshes = treeMats.map(m => {
  const fm = new THREE.InstancedMesh(foliageGeo, m, TREE_COUNT * FOLIAGE_TIERS);
  fm.frustumCulled = false;
  return fm;
});
const fillIdx = [0, 0, 0, 0]; // next free slot per colour batch

for (let i = 0; i < TREE_COUNT; i++) {
  // ── Six RNG calls per tree, same order as Phase 1 B1-fix ──────────────
  const baseT   = (i + 0.5) / TREE_COUNT;
  const jitter  = (rng() - 0.5) * (0.85 / TREE_COUNT);           // rng #1: t jitter
  const t       = THREE.MathUtils.clamp(baseT + jitter, 0.005, 0.995);
  const p       = path.getPointAt(t);
  const tan     = path.getTangentAt(t);
  const perp    = new THREE.Vector3(-tan.z, 0, tan.x).normalize(); // unit perpendicular
  const side    = rng() < 0.5 ? 1 : -1;                           // rng #2: left/right
  const dist    = 7 + rng() * 35;                                  // rng #3: lateral distance
  const scale   = 0.55 + rng() * 1.9;                             // rng #4: tree scale
  const typeIdx = Math.floor(rng() * 4);                           // rng #5: foliage colour
  const rotY    = rng() * Math.PI;                                 // rng #6: Y rotation

  const wx = p.x + perp.x * side * dist; // world X position
  const wz = p.z + perp.z * side * dist; // world Z position

  // ── Trunk instance ──────────────────────────────────────────────────────
  _ipos.set(wx, 0.7 * scale, wz);       // centre at 0.7s → base at 0 (ground)
  _qY.setFromAxisAngle(_axY, rotY);
  _iscl.set(scale, scale, scale);        // uniform scale reproduces original geometry sizes
  _m4.compose(_ipos, _qY, _iscl);
  trunkMesh.setMatrixAt(i, _m4);

  // ── Foliage tiers ───────────────────────────────────────────────────────
  const c = typeIdx % 4;
  for (let j = 0; j < FOLIAGE_TIERS; j++) {
    const rScale = (1.0 - j * 0.19) * scale; // horizontal radius for tier j
    _ipos.set(wx, (1.2 + j * 0.62) * scale, wz);
    _qY.setFromAxisAngle(_axY, rotY);
    _iscl.set(rScale, 1.8 * scale, rScale);
    _m4.compose(_ipos, _qY, _iscl);
    foliageMeshes[c].setMatrixAt(fillIdx[c]++, _m4);
  }
}

trunkMesh.instanceMatrix.needsUpdate = true;
scene.add(trunkMesh);

foliageMeshes.forEach((fm, c) => {
  fm.count = fillIdx[c]; // trim to actual instance count for this colour
  fm.instanceMatrix.needsUpdate = true;
  scene.add(fm);
});

// ── Sun disc ──────────────────────────────────────────────────────────────
const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(7, 24, 16),
  new THREE.MeshBasicMaterial({ color: '#ffd79a' })
);
sunDisc.position.set(-22, 27, -300);
scene.add(sunDisc);

// ── Milestone markers ─────────────────────────────────────────────────────
// Floating torus rings with bobbing orbs, positioned on alternating sides of
// the road using the correct tangent perpendicular (same logic as tree fix).
const markerGroup = new THREE.Group();
const markers = [];
chapters.forEach((ch, i) => {
  const t    = markerTs[i];
  const p    = path.getPointAt(t);
  const tan  = path.getTangentAt(t);
  const side = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
  const pos  = p.clone().addScaledVector(side, i % 2 ? 7 : -7);
  pos.y = 1.7;

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.05, 0.09, 10, 32),
    new THREE.MeshStandardMaterial({
      color: '#ffdc91', emissive: '#ffb94f',
      emissiveIntensity: 2.5, metalness: 0.2, roughness: 0.3,
    })
  );
  ring.position.copy(pos);
  ring.userData = { index: i };
  markerGroup.add(ring);

  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 16, 12),
    new THREE.MeshBasicMaterial({ color: '#fff0c4' })
  );
  orb.position.copy(pos);
  orb.position.y += 1.2;
  markerGroup.add(orb);

  markers.push({ ring, orb, t, pos, index: i });
});
scene.add(markerGroup);

// ── Seasonal colour palettes ──────────────────────────────────────────────
const seasonLooks = [
  { sky: '#e6ad7c', fog: '#dba77c', ground: '#62704e', sun: '#ffd49a' }, // 0 beginning
  { sky: '#94c6dc', fog: '#9dbdca', ground: '#527a4f', sun: '#fff0b0' }, // 1 building
  { sky: '#e8a06b', fog: '#ce8b67', ground: '#886847', sun: '#ffd08a' }, // 2 family
  { sky: '#b3c6dc', fog: '#9eabbc', ground: '#65766e', sun: '#fff1d0' }, // 3 renewal
  { sky: '#f5c27f', fog: '#e6ad79', ground: '#6f7952', sun: '#fff0b5' }, // 4 future
];
let seasonTarget = 0;
function setSeason(i) { seasonTarget = Math.max(0, Math.min(4, i)); }

// B2 ANALYSIS & RESULT: The exponential-smoothing approach is correct and
// frame-rate independent.  Proof:
//   alpha = 1 - exp(-k·dt)
//   After N frames: remaining_error = (1-alpha)^N = exp(-k·dt)^N = exp(-k·T)
// where T = total elapsed time, independent of N or dt.
// With k = 1.2, τ = 1/k ≈ 0.83 s.  95% complete in ~2.5 s — appropriate for
// a scenic seasonal transition.  NO CHANGE REQUIRED to the algorithm.
//
// Optimization applied: reuse a single Color object to avoid allocating
// `new THREE.Color()` on every animation frame (reduces GC pressure).
const _blendCol = new THREE.Color();
function blendSeason(dt) {
  const s     = seasonLooks[seasonTarget];
  const alpha = 1 - Math.exp(-dt * 1.2);
  _blendCol.set(s.sky);    scene.background.lerp(_blendCol, alpha);
  _blendCol.set(s.fog);    scene.fog.color.lerp(_blendCol, alpha);
  _blendCol.set(s.ground); ground.material.color.lerp(_blendCol, alpha);
  _blendCol.set(s.sun);    sunDisc.material.color.lerp(_blendCol, alpha);
                           sun.color.lerp(_blendCol, alpha);
}

// ── Camera helpers ────────────────────────────────────────────────────────
function atT(t) { return path.getPointAt(THREE.MathUtils.clamp(t, 0, 0.9999)); }
function cameraPose(t, lookAhead = 0.035) {
  const p    = atT(t);
  const look = atT(Math.min(0.999, t + lookAhead));
  camera.position.set(p.x, p.y + 2.15, p.z);
  camera.lookAt(look.x, look.y + 1.5, look.z);
}

// ── Travel state ──────────────────────────────────────────────────────────
// B3 FIX: targetT removed — was declared but never read anywhere in the code.
let camT = 0, travelStart = 0, travelFrom = 0, travelTo = 0, travelDuration = 3600;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function goTo(index) {
  if (travelling || index < 0 || index >= chapters.length) return;
  closeModal();
  current       = index;
  const dest    = markerTs[index];
  travelFrom    = camT;
  travelTo      = Math.max(0.015, dest - 0.025);
  travelStart   = performance.now();
  travelDuration = reducedMotion ? 600 : 3000 + Math.abs(travelTo - travelFrom) * 2400;
  travelling    = true;
  stopped       = false;
  $('nextBtn').disabled   = true;
  $('memoryBtn').disabled = true;
  $('hero').style.opacity   = '.1';
  $('hero').style.transform = 'translateY(12px)';
  setSeason(chapters[index].season);
}

// ── Animation loop ────────────────────────────────────────────────────────
let lastFrame = 0;

function render(now) {
  requestAnimationFrame(render);

  // Clamp dt to 100 ms maximum.  Without this, returning from a background tab
  // can produce a huge dt that jerks the camera position forward. (Rendering stability)
  const dt = Math.min(0.1, (now - lastFrame) / 1000 || 0.016);
  lastFrame = now;

  blendSeason(dt);

  // displayT is what cameraPose() actually uses.  camT holds the canonical
  // parked or travel position; displayT may include a transient idle offset.
  let displayT = camT;

  if (travelling) {
    const q = Math.min(1, (now - travelStart) / travelDuration);
    camT     = THREE.MathUtils.lerp(travelFrom, travelTo, ease(q));
    displayT = camT;
    if (q >= 1) {
      travelling = false;
      stopped    = true;
      $('nextBtn').disabled   = false;
      $('memoryBtn').disabled = false;
      $('hero').style.opacity   = '1';
      $('hero').style.transform = 'translateY(0)';
      updateCopy();
    }
  } else if (stopped) {
    // B5 FIX: idle breathing — a sinusoidal offset applied ONLY to the display
    // position; camT is never mutated, so there is zero cumulative drift.
    // Amplitude: 0.00012 t ≈ 0.08 world units — sub-perceptible as forward
    // motion but gives the parked view a faint, living quality.
    // Period: 2π / 0.0009 ms ≈ 7 s — slow enough to avoid motion sickness.
    // Silenced when the user has requested reduced motion.
    if (!reducedMotion) {
      displayT = camT + Math.sin(now * 0.0009) * 0.00012;
    }
  }

  cameraPose(displayT);

  // B8 FIX: removed the previous per-frame loop that set every dash mesh's
  // .visible to true.  No code ever sets any dash invisible, so the loop was
  // a no-op executed 60 times per second.

  markers.forEach((m, i) => {
    m.ring.rotation.z = Math.sin(now * 0.0015 + i) * 0.08;
    m.orb.position.y  = m.pos.y + 1.2 + Math.sin(now * 0.002 + i) * 0.18;
    m.ring.material.emissiveIntensity = i === current ? 3.4 : 1.5;
  });

  renderer.render(scene, camera);
}

// ── UI: copy updates ──────────────────────────────────────────────────────
function updateCopy() {
  const c = chapters[current], s = stops[current];
  $('eyebrow').textContent  = c.tag;
  $('title').innerHTML      = c.title.replace('\n', '<br>');
  $('subtitle').textContent = c.subtitle;
  $('count').textContent    = `${c.stop.toUpperCase()} · ${current + 1} OF ${chapters.length}`;
  $('hint').textContent     = current === chapters.length - 1
    ? 'You\u2019ve reached the horizon. There is still so much beautiful road ahead.'
    : 'Tap \u201cOpen this stop\u201d for the memory, then continue down the road.';
  $('nextBtn').textContent  = current === 0
    ? 'Start Journey \u2192'
    : current === chapters.length - 1
      ? 'Restart Journey \u21BA'
      : 'Continue Journey \u2192';
  $('prevBtn').disabled = travelling || current === 0;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
}

// ── UI: photo gallery ─────────────────────────────────────────────────────
function fillGallery(id, photos) {
  const host = $(id);
  host.replaceChildren();
  for (const photo of photos) {
    if (!photo.src) continue;
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    const cap = document.createElement('figcaption');
    img.src     = photo.src;
    img.alt     = photo.caption || 'Memory photograph';
    img.loading = 'lazy';
    img.onerror = () => {
      img.style.display = 'none';
      cap.textContent   = 'Photo not added yet: ' + photo.src;
    };
    cap.textContent = photo.caption || '';
    fig.append(img, cap);
    host.append(fig);
  }
}

// ── UI: memory panel open / close ────────────────────────────────────────

function openModal() {
  const c = chapters[current], s = stops[current];
  const isFinal = current === stops.length - 1;

  // ── Stop identity ──────────────────────────────────────────────────────
  // Eyebrow: year badge · stop title tag
  $('mEyebrow').textContent  = s.year ? s.year + ' · ' + c.tag : c.tag;
  // Headline (the stop's main title)
  $('mTitle').textContent    = s.title;
  // Subtitle (narrative tagline)
  $('mSubtitle').textContent = c.subtitle || '';

  // ── Story body: split on blank lines → individual <p> elements ────────
  // Using <p> per paragraph gives proper semantic spacing and avoids a wall
  // of text. pre-line whitespace-mode is replaced by explicit DOM structure.
  const rawStory = isFinal
    ? s.story + '\n\n' + content.site.finalLetter
    : s.story;

  const storyEl = $('mBody');
  storyEl.innerHTML = '';
  rawStory.split(/\n{2,}/).forEach(para => {
    const trimmed = para.trim();
    if (!trimmed) return;
    const p = document.createElement('p');
    p.textContent = trimmed;
    storyEl.appendChild(p);
  });

  // ── Telugu message: hide section when empty ───────────────────────────
  const teluguEl = $('mTelugu');
  const teluguText = isFinal
    ? (content.site.finalTelugu || s.teluguMessage || '').trim()
    : (s.teluguMessage || '').trim();
  if (teluguText) {
    teluguEl.textContent = teluguText;
    teluguEl.removeAttribute('hidden');
  } else {
    teluguEl.textContent = '';
    teluguEl.setAttribute('hidden', '');
  }

  // ── Photo galleries ────────────────────────────────────────────────────
  fillGallery('photoGallery', s.photos || []);
  const future = (content.site.futureScenes || []).filter(
    f => s.futureScene && (f.id === s.futureScene || s.futureScene === 'all')
  );
  fillGallery('futureGallery', future.map(f => ({
    src: f.src,
    caption: f.title + ' · An imagined possibility',
  })));

  // ── Show panel and manage accessibility ───────────────────────────────
  const wrap = $('modalWrap');
  wrap.setAttribute('aria-hidden', 'false');
  wrap.classList.add('show');
  // Scroll panel back to top in case it was scrolled on a previous visit.
  const panel = wrap.querySelector('.panel');
  if (panel) panel.scrollTop = 0;
  // Focus the close button — first interactive element in the panel.
  $('closeBtn').focus();
}

function closeModal() {
  const wrap = $('modalWrap');
  wrap.classList.remove('show');
  wrap.setAttribute('aria-hidden', 'true');
  // Return focus to the HUD button the visitor used to open the panel.
  $('memoryBtn').focus();
}

// ── Button listeners ──────────────────────────────────────────────────────
// ── Button listeners ──────────────────────────────────────────────────────
$('nextBtn').addEventListener('click', () =>
  goTo(current === chapters.length - 1 ? 0 : current + 1)
);
$('prevBtn').addEventListener('click', () => goTo(current - 1));
$('memoryBtn').addEventListener('click', openModal);

// Panel close: ✕ button (top corner) and the text "Return to Road" button.
$('closeBtn').addEventListener('click', closeModal);
$('panelReturnBtn').addEventListener('click', closeModal);

// Continue: closes panel then advances to the next stop (wraps at end).
$('continueBtn').addEventListener('click', () => {
  closeModal();
  goTo(current === chapters.length - 1 ? 0 : current + 1);
});

// Clicking the backdrop (the area outside the panel, or directly the wrapper
// on desktop where the backdrop covers the full left side) also closes the panel.
$('panelBackdrop').addEventListener('click', closeModal);

// ── Keyboard navigation (B7) ──────────────────────────────────────────────
// ArrowRight / ArrowLeft  — next / previous milestone (when not travelling)
// Enter or Space          — open the current memory panel (when stopped & no modal)
// Escape                  — close an open memory panel (works even when a
//                           button inside the panel has focus)
//
// Navigation is suppressed while the camera is travelling and inside any
// focused form control or interactive element.
addEventListener('keydown', e => {
  // Never steal keystrokes from form controls.
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  const modalOpen = $('modalWrap').classList.contains('show');

  // Escape closes the panel regardless of which element inside it has focus.
  if (e.key === 'Escape') {
    if (modalOpen) { e.preventDefault(); closeModal(); }
    return;
  }

  // While the modal is open, let Tab / Enter / Space operate its own buttons.
  if (modalOpen) return;

  if (e.key === 'ArrowRight' && !travelling) {
    e.preventDefault();
    if (current < chapters.length - 1) goTo(current + 1);
  } else if (e.key === 'ArrowLeft' && !travelling) {
    e.preventDefault();
    if (current > 0) goTo(current - 1);
  } else if ((e.key === 'Enter' || e.key === ' ') && stopped && !travelling) {
    // Yield to buttons, links, and contenteditable elements — they handle
    // their own activation. Only open the modal when focus is on a
    // non-interactive element (canvas, document body, etc.).
    if (tag === 'BUTTON' || tag === 'A' || e.target.isContentEditable) return;
    e.preventDefault();
    openModal();
  }
});

// ── Raycaster — click / tap on milestone rings ────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
canvas.addEventListener('pointerup', e => {
  if (travelling || $('modalWrap').classList.contains('show')) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(markers.map(m => m.ring));
  if (hits.length) {
    const i = hits[0].object.userData.index;
    if (i === current) openModal();
    else goTo(i);
  }
});

// ── Progress dots ─────────────────────────────────────────────────────────
chapters.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'dot' + (i === 0 ? ' active' : '');
  b.title     = c.stop;
  b.setAttribute('aria-label', 'Go to ' + c.stop);
  b.addEventListener('click', () => goTo(i));
  $('progress').appendChild(b);
});

// ── Tab visibility: prevent dt spike on restore (rendering stability) ─────
// When a tab is hidden and re-shown, `now` in the RAF callback may be much
// larger than lastFrame, causing a single enormous dt that snaps the camera.
// Resetting lastFrame to the current time on visibility restore bounds dt to
// the safe maximum of 100 ms on the very next frame.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastFrame = performance.now();
});

// ── Window resize ─────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

// ── Initialise ────────────────────────────────────────────────────────────
camT = 0.012;
cameraPose(camT);
updateCopy();
// Override the chapter counter to show a "ready" prompt before the first journey.
$('count').textContent = 'READY TO BEGIN · 1 OF ' + chapters.length;
$('loading').classList.add('hide');
setTimeout(() => $('loading').remove(), 800);

// Single RAF entry point — render() re-registers itself, so there is exactly
// one running animation loop at all times. (Rendering stability)
requestAnimationFrame(render);

// Phase 2 performance diagnostic — fires once after the first rendered frame.
// Open browser DevTools console to read actual draw-call and triangle counts.
requestAnimationFrame(() => {
  const info = renderer.info.render;
  const mem  = renderer.info.memory;
  console.group('%c[Phase 2 Performance] Three.js renderer.info', 'color:#ffd58a;font-weight:bold');
  console.log('Draw calls  :', info.calls,     '(target: ~21)');
  console.log('Triangles   :', info.triangles, '(estimated: ~18 000)');
  console.log('Geometries  :', mem.geometries, '(was ~1 650+ before instancing)');
  console.log('Instanced batches: 6 mountain + 1 trunk + 4 foliage = 11 InstancedMesh');
  console.groupEnd();
});
</script>
</body>
</html>
