<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="room-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a3c"/>
      <stop offset="100%" stop-color="#0e1620"/>
    </linearGradient>
    <radialGradient id="window-light" cx="72%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#ffe8a8" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#f0c060" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#c07020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelf-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5030"/>
      <stop offset="100%" stop-color="#5a3820"/>
    </linearGradient>
    <filter id="warm-glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark room background -->
  <rect width="800" height="600" fill="url(#room-bg)"/>

  <!-- Window (right side)  sunlight pouring in -->
  <rect x="540" y="60" width="180" height="260" rx="6" fill="#ffe8c0" opacity=".15"/>
  <rect x="540" y="60" width="180" height="260" rx="6" fill="none" stroke="#d4a850" stroke-width="4" opacity=".7"/>
  <!-- Window panes -->
  <line x1="630" y1="65" x2="630" y2="315" stroke="#d4a850" stroke-width="2.5" opacity=".6"/>
  <line x1="545" y1="185" x2="715" y2="185" stroke="#d4a850" stroke-width="2.5" opacity=".6"/>
  <!-- Sunlight wash from window -->
  <ellipse cx="630" cy="190" rx="220" ry="200" fill="url(#window-light)"/>

  <!-- Ceiling / wall junction -->
  <rect x="0" y="0" width="800" height="40" fill="#161e2c" opacity=".8"/>

  <!-- Bookshelf (wall-mounted, left half) -->
  <!-- Uprights -->
  <rect x="70" y="80" width="10" height="380" rx="3" fill="url(#shelf-wood)"/>
  <rect x="380" y="80" width="10" height="380" rx="3" fill="url(#shelf-wood)"/>
  <!-- Shelves -->
  <rect x="68" y="100" width="324" height="12" rx="2" fill="url(#shelf-wood)"/>
  <rect x="68" y="190" width="324" height="12" rx="2" fill="url(#shelf-wood)"/>
  <rect x="68" y="280" width="324" height="12" rx="2" fill="url(#shelf-wood)"/>
  <rect x="68" y="370" width="324" height="12" rx="2" fill="url(#shelf-wood)"/>

  <!-- Books on top shelf -->
  <g>
    <rect x="80" y="112" width="14" height="77" rx="2" fill="#8b2020"/>
    <rect x="96" y="118" width="11" height="71" rx="2" fill="#205080"/>
    <rect x="109" y="112" width="16" height="77" rx="2" fill="#206020"/>
    <rect x="127" y="116" width="12" height="73" rx="2" fill="#806020"/>
    <rect x="141" y="112" width="18" height="77" rx="2" fill="#502080"/>
    <rect x="161" y="114" width="13" height="75" rx="2" fill="#204060"/>
    <rect x="176" y="112" width="15" height="77" rx="2" fill="#802020"/>
    <rect x="193" y="118" width="10" height="71" rx="2" fill="#408040"/>
    <rect x="205" y="112" width="17" height="77" rx="2" fill="#604020"/>
    <rect x="224" y="114" width="13" height="75" rx="2" fill="#203060"/>
    <rect x="239" y="112" width="12" height="77" rx="2" fill="#802040"/>
    <rect x="253" y="116" width="15" height="73" rx="2" fill="#205040"/>
    <rect x="270" y="112" width="11" height="77" rx="2" fill="#604060"/>
    <rect x="283" y="114" width="16" height="75" rx="2" fill="#402060"/>
    <rect x="301" y="112" width="14" height="77" rx="2" fill="#206040"/>
    <rect x="317" y="118" width="12" height="71" rx="2" fill="#804020"/>
    <rect x="331" y="112" width="15" height="77" rx="2" fill="#205060"/>
    <rect x="348" y="114" width="18" height="75" rx="2" fill="#602020"/>
  </g>

  <!-- Books on second shelf (slightly fewer, some laid sideways) -->
  <g>
    <rect x="80" y="202" width="16" height="70" rx="2" fill="#205060"/>
    <rect x="98" y="204" width="12" height="68" rx="2" fill="#603020"/>
    <rect x="112" y="202" width="18" height="70" rx="2" fill="#204040"/>
    <rect x="132" y="207" width="12" height="65" rx="2" fill="#802020"/>
    <!-- Lying sideways stack -->
    <rect x="154" y="238" width="55" height="12" rx="2" fill="#4a6080" opacity=".9"/>
    <rect x="154" y="224" width="55" height="12" rx="2" fill="#6a4080" opacity=".9"/>
    <rect x="154" y="210" width="55" height="12" rx="2" fill="#406040" opacity=".9"/>
    <!-- More upright -->
    <rect x="215" y="202" width="13" height="70" rx="2" fill="#802040"/>
    <rect x="230" y="205" width="15" height="67" rx="2" fill="#205030"/>
    <rect x="247" y="202" width="16" height="70" rx="2" fill="#403060"/>
    <rect x="265" y="204" width="12" height="68" rx="2" fill="#604040"/>
    <rect x="279" y="202" width="17" height="70" rx="2" fill="#204060"/>
    <rect x="298" y="207" width="14" height="65" rx="2" fill="#6a3020"/>
    <rect x="314" y="202" width="11" height="70" rx="2" fill="#205050"/>
    <rect x="327" y="205" width="15" height="67" rx="2" fill="#402040"/>
    <rect x="344" y="202" width="18" height="70" rx="2" fill="#203060"/>
  </g>

  <!-- Desk below the window (right side) -->
  <rect x="430" y="340" width="320" height="180" rx="6" fill="#4a3020" opacity=".9"/>
  <rect x="425" y="335" width="330" height="16" rx="4" fill="#6a4828" opacity=".95"/>
  <!-- Desk legs -->
  <rect x="440" y="510" width="18" height="60" rx="4" fill="#3a2010"/>
  <rect x="720" y="510" width="18" height="60" rx="4" fill="#3a2010"/>

  <!-- Desk items: sketchbook open -->
  <rect x="440" y="290" width="130" height="100" rx="4" fill="#f0ead8" transform="rotate(-5 505 340)"/>
  <line x1="505" y1="292" x2="502" y2="386" stroke="#c0b49a" stroke-width="1.5" opacity=".6"/>
  <!-- Sketch lines on book -->
  <g opacity=".4" stroke="#8a7a60" stroke-width="1.2">
    <line x1="445" y1="320" x2="495" y2="315"/>
    <line x1="447" y1="330" x2="492" y2="326"/>
    <line x1="448" y1="340" x2="493" y2="336"/>
    <line x1="448" y1="350" x2="492" y2="347"/>
    <!-- Small sketch shape -->
    <ellipse cx="468" cy="305" rx="12" ry="8" fill="none"/>
    <ellipse cx="475" cy="295" rx="6" ry="6" fill="none"/>
  </g>

  <!-- Pencil on desk -->
  <rect x="575" y="330" width="120" height="7" rx="3" fill="#e0b840" transform="rotate(-12 635 334)"/>
  <polygon points="575,327 568,334 575,340" fill="#d09030" transform="rotate(-12 635 334)"/>

  <!-- Small succulent plant on desk -->
  <rect x="690" y="308" width="32" height="28" rx="8" fill="#5a3020"/>
  <ellipse cx="706" cy="307" rx="17" ry="8" fill="#4a2a12"/>
  <!-- Plant leaves -->
  <ellipse cx="706" cy="298" rx="9" ry="14" fill="#3a7040" transform="rotate(-15 706 298)"/>
  <ellipse cx="706" cy="298" rx="9" ry="14" fill="#3a7040" transform="rotate(15 706 298)"/>
  <ellipse cx="706" cy="295" rx="7" ry="12" fill="#4a8050"/>
  <ellipse cx="693" cy="303" rx="6" ry="10" fill="#3a7040" transform="rotate(-30 693 303)"/>
  <ellipse cx="719" cy="303" rx="6" ry="10" fill="#3a7040" transform="rotate(30 719 303)"/>

  <!-- Reading lamp on desk (warm light source) -->
  <rect x="593" y="270" width="7" height="80" rx="3" fill="#5a4030"/>
  <ellipse cx="596" cy="268" rx="25" ry="14" fill="#e0c870" opacity=".9"/>
  <!-- Lamp glow on desk -->
  <ellipse cx="596" cy="360" rx="80" ry="40" fill="#ffe090" opacity=".12" filter="url(#warm-glow)"/>

  <!-- Floor -->
  <rect x="0" y="530" width="800" height="70" fill="#0c1018"/>
  <!-- Floor reflection of window light -->
  <ellipse cx="600" cy="540" rx="160" ry="30" fill="#e0b840" opacity=".07"/>

  <!-- Small decorative string lights above shelf -->
  <path d="M70,82 Q130,90 200,82 Q270,74 340,82 Q380,86 380,86" fill="none" stroke="#d4a020" stroke-width="1.5" opacity=".5"/>
  <g fill="#ffe8a0" opacity=".8">
    <circle cx="130" cy="90" r="3"/>
    <circle cx="190" cy="83" r="3"/>
    <circle cx="250" cy="87" r="3"/>
    <circle cx="310" cy="82" r="3"/>
  </g>

  <!-- Caption bar -->
  <rect x="0" y="556" width="800" height="44" fill="#0c1420" opacity=".75"/>
  <text x="400" y="583" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="16" fill="#ffd98a" letter-spacing="0.06em">Rediscovering Interests</text>
</svg>
