<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="horizon-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="30%" stop-color="#1e3a6a"/>
      <stop offset="58%" stop-color="#e8702a"/>
      <stop offset="75%" stop-color="#f5c060"/>
      <stop offset="100%" stop-color="#f8e090"/>
    </linearGradient>
    <radialGradient id="horizon-glow" cx="50%" cy="58%" r="32%">
      <stop offset="0%" stop-color="#fff0a0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffb030" stop-opacity=".8"/>
      <stop offset="65%" stop-color="#e06010" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#a03000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="road-end-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe890" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffe890" stop-opacity="0"/>
    </radialGradient>
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="horizon-blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#horizon-sky)"/>

  <!-- Stars in upper portion -->
  <g fill="#ffffff" filter="url(#star-glow)">
    <circle cx="80" cy="55" r="1.8" opacity=".9"/>
    <circle cx="155" cy="30" r="1.4" opacity=".8"/>
    <circle cx="220" cy="68" r="1.6" opacity=".85"/>
    <circle cx="290" cy="42" r="1.2" opacity=".75"/>
    <circle cx="340" cy="80" r="1.4" opacity=".7"/>
    <circle cx="460" cy="38" r="1.6" opacity=".8"/>
    <circle cx="520" cy="72" r="1.3" opacity=".85"/>
    <circle cx="590" cy="28" r="1.8" opacity=".9"/>
    <circle cx="650" cy="58" r="1.5" opacity=".8"/>
    <circle cx="720" cy="40" r="1.4" opacity=".75"/>
    <circle cx="105" cy="110" r="1.2" opacity=".6"/>
    <circle cx="180" cy="130" r="1" opacity=".5"/>
    <circle cx="250" cy="95" r="1.3" opacity=".6"/>
    <circle cx="380" cy="115" r="1.1" opacity=".55"/>
    <circle cx="440" cy="90" r="1.4" opacity=".6"/>
    <circle cx="560" cy="110" r="1.2" opacity=".6"/>
    <circle cx="680" cy="95" r="1.1" opacity=".5"/>
    <circle cx="740" cy="120" r="1.3" opacity=".6"/>
  </g>

  <!-- Venus / bright planet near horizon -->
  <circle cx="560" cy="200" r="3.5" fill="#fff5c0" opacity=".95" filter="url(#star-glow)"/>
  <circle cx="560" cy="200" r="10" fill="#ffe890" opacity=".2"/>

  <!-- Horizon glow (the unseen sun below horizon, casting upward light) -->
  <ellipse cx="400" cy="350" rx="500" ry="100" fill="url(#horizon-glow)"/>
  <ellipse cx="400" cy="358" rx="200" ry="30" fill="#ffe090" opacity=".25" filter="url(#horizon-blur)"/>

  <!-- Distant silhouette hills / horizon line -->
  <path d="M0,360 Q50,340 120,355 Q200,370 280,345 Q360,322 440,340 Q520,355 600,335 Q680,318 760,340 Q790,348 800,355 L800,600 L0,600Z"
        fill="#0a1828" opacity=".9"/>

  <!-- Mid-range gently rolling dark land -->
  <path d="M0,390 Q100,375 200,388 Q300,400 400,382 Q500,364 600,380 Q700,395 800,378 L800,600 L0,600Z"
        fill="#0c1e2e" opacity=".95"/>

  <!-- Near land (foreground) -->
  <rect x="0" y="450" width="800" height="150" fill="#060e18"/>

  <!-- ROAD  vanishing-point perspective, warm lit from glow ahead -->
  <!-- Road surface gradient (darker edges, luminous centre-ahead) -->
  <polygon points="330,600 470,600 430,350 370,350" fill="#1a2e48" opacity=".9"/>
  <!-- Road centre shine (the vanishing point glow) -->
  <polygon points="392,600 408,600 402,350 398,350" fill="#c87010" opacity=".18"/>
  <!-- White dashes (centre line) -->
  <g fill="#e8c870" opacity=".7">
    <rect x="397" y="540" width="6" height="20" rx="2"/>
    <rect x="397" y="510" width="6" height="16" rx="2" opacity=".8"/>
    <rect x="397.5" y="485" width="5" height="12" rx="2" opacity=".6"/>
    <rect x="398" y="465" width="5" height="9" rx="2" opacity=".45"/>
    <rect x="398.5" y="450" width="4" height="7" rx="2" opacity=".3"/>
    <rect x="399" y="438" width="4" height="5" rx="2" opacity=".2"/>
  </g>
  <!-- Road edge lines -->
  <line x1="330" y1="600" x2="370" y2="350" stroke="#c89040" stroke-width="2.5" opacity=".45"/>
  <line x1="470" y1="600" x2="430" y2="350" stroke="#c89040" stroke-width="2.5" opacity=".45"/>

  <!-- Warm glow at vanishing point (the goal ahead) -->
  <ellipse cx="400" cy="352" rx="80" ry="40" fill="url(#road-end-glow)"/>
  <ellipse cx="400" cy="352" rx="30" ry="14" fill="#fff0a0" opacity=".6"/>

  <!-- Cypress/tall trees lining the road (silhouette) -->
  <!-- Left row -->
  <g fill="#060e18" opacity=".98">
    <ellipse cx="295" cy="430" rx="16" ry="55"/>
    <ellipse cx="255" cy="440" rx="14" ry="50"/>
    <ellipse cx="220" cy="445" rx="12" ry="44"/>
    <ellipse cx="188" cy="450" rx="11" ry="40"/>
    <ellipse cx="158" cy="455" rx="10" ry="36"/>
    <ellipse cx="130" cy="460" rx="9" ry="32"/>
    <ellipse cx="105" cy="462" rx="8" ry="28"/>
  </g>
  <!-- Right row -->
  <g fill="#060e18" opacity=".98">
    <ellipse cx="505" cy="430" rx="16" ry="55"/>
    <ellipse cx="545" cy="440" rx="14" ry="50"/>
    <ellipse cx="580" cy="445" rx="12" ry="44"/>
    <ellipse cx="612" cy="450" rx="11" ry="40"/>
    <ellipse cx="642" cy="455" rx="10" ry="36"/>
    <ellipse cx="670" cy="460" rx="9" ry="32"/>
    <ellipse cx="695" cy="462" rx="8" ry="28"/>
  </g>

  <!-- Warm glow spilling onto foreground from ahead -->
  <ellipse cx="400" cy="500" rx="200" ry="80" fill="#e87020" opacity=".06"/>

  <!-- Caption bar -->
  <rect x="0" y="556" width="800" height="44" fill="#060c18" opacity=".82"/>
  <text x="400" y="583" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="16" fill="#ffd98a" letter-spacing="0.06em">The Years Ahead</text>
</svg>
